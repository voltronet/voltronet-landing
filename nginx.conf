server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Securitate de bază: ascunde versiunea Nginx
    server_tokens off;

    # ==========================================
    # COMPRESIE GZIP
    # ==========================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/javascript 
        application/json 
        image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # ==========================================
    # RUTA PRINCIPALĂ (HTML) - Cache + Securitate
    # ==========================================
    location / {
        try_files $uri $uri/ =404;
        
        # Cache Control pentru HTML (fără cache)
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;

        # Headere de Securitate Enterprise (repetate aici pentru a nu fi suprascrise)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' https: data:; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data:;" always;
    }

    # ==========================================
    # RESURSE STATICE (/assets) - Cache pe termen lung + Securitate
    # ==========================================
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        
        # Păstrăm și aici headerele de securitate pentru fișierele statice
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        
        access_log off;
    }
}
