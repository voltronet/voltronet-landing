name: VOLTRONET CI/CD & Docker Hub

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarcă codul sursă
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setează Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Autentificare pe Docker Hub folosind variabila de user și token-ul secret
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # 4. Construiește imaginea local pentru teste
      - name: Build Docker Image Locally
        run: |
          docker build -t voltronet-local:latest .

      # 5. Pornește containerul Nginx pentru testare
      - name: Run Docker Container
        run: |
          docker run -d --name voltronet-web -p 8088:80 voltronet-local:latest

      # 6. Așteaptă pornirea serviciului
      - name: Wait for Nginx to start
        run: sleep 3

      # 7. Rulează testele smoke extinse (inclusiv CSS, JS, Gzip și Securitate)
      - name: Run Comprehensive Smoke & Asset Tests
        run: |
          chmod +x smoke-test.sh
          ./smoke-test.sh http://localhost:8088

      # 8. Curăță containerul de test
      - name: Cleanup Test Container
        if: always()
        run: |
          docker stop voltronet-web || true
          docker rm voltronet-web || true

      # 9. Construiește și trimite (Push) imaginea pe Docker Hub (doar la push pe main/master)
      - name: Build and Push to Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKER_HUB_USERNAME }}/voltronet:latest
            ${{ vars.DOCKER_HUB_USERNAME }}/voltronet:${{ github.sha }}
