name: VOLTRONET CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Pasul 1: Descarcă codul sursă din repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Pasul 2: Setează mediul Docker Buildx pentru build-uri avansate
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pasul 3: Construiește imaginea Docker local în runner
      - name: Build Docker Image
        run: |
          docker build -t voltronet-local:latest .

      # Pasul 4: Pornește containerul Nginx pentru testare pe portul 8088
      - name: Run Docker Container
        run: |
          docker run -d --name voltronet-web -p 8088:80 voltronet-local:latest

      # Pasul 5: Așteaptă câteva secunde ca Nginx să pornească complet
      - name: Wait for Nginx to start
        run: sleep 3

      # Pasul 6: Setează permisiunile și rulează scriptul tău de teste smoke
      - name: Run Smoke Tests & Security Check
        run: |
          chmod +x smoke-test.sh
          ./smoke-test.sh http://localhost:8088

      # Pasul 7: Curăță containerul după finalizarea testelor (opțional, dar recomandat)
      - name: Cleanup Container
        if: always()
        run: |
          docker stop voltronet-web || true
          docker rm voltronet-web || true
